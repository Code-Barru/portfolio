services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_MAPTILER_API_KEY=${PUBLIC_MAPTILER_API_KEY}
    container_name: portfolio
    ports:
      - '80:80'
    depends_on:
      contact-proxy:
        condition: service_started
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  contact-proxy:
    build:
      context: ./services/contact-proxy
      dockerfile: Dockerfile
    container_name: contact-proxy
    restart: unless-stopped
    environment:
      - NTFY_URL=http://ntfy
      - NTFY_TOPIC=${NTFY_TOPIC:-contact-portfolio}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-5}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
    depends_on:
      ntfy:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command: serve
    restart: unless-stopped
    ports:
      - '${NTFY_PORT:-8080}:80'
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-etc:/etc/ntfy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  ntfy-cache:
  ntfy-etc:
