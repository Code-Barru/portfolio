services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_MAPTILER_API_KEY=${PUBLIC_MAPTILER_API_KEY}
    container_name: portfolio
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
